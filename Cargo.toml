[package]
name = "vibeshop"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[dependencies]
anyhow = "1.0"
bytemuck = { version = "1.24", features = ["derive"] }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "accesskit", "x11", "wayland"] }
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }
pollster = "0.4"
rfd = "0.15"
tempfile = "3"
wgpu = "=27.0.1"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.dev.package."*"]
opt-level = 2
