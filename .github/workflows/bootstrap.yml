name: Finish bootstrap safety fixes
on:
  push:
    branches: [agent/bootstrap-editor]
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'Mik-pe/vibeshop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/bootstrap-editor
      - run: |
          node scripts/bootstrap-edit.mjs
          node scripts/bootstrap-lints.mjs
          cargo fmt --all
          git add src tests README.md
          git rm scripts/bootstrap-edit.mjs scripts/bootstrap-lints.mjs .github/workflows/bootstrap.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Guard stale exports and late image loads; fix diagnostics; remove bootstrap workflow'
          git push origin HEAD:agent/bootstrap-editor
