name: Bootstrap lockfile and formatting
on:
  push:
    branches: [agent/bootstrap-editor]
    paths: ['.github/workflows/bootstrap.yml']
permissions:
  contents: write
jobs:
  normalize:
    if: github.repository == 'Mik-pe/vibeshop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: agent/bootstrap-editor
      - run: |
          rustup show
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock src tests
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Lock dependencies and format the initial Rust implementation'
            git push origin HEAD:agent/bootstrap-editor
          fi
