name: runner-smoke
on:
  workflow_dispatch:
permissions: {}
jobs:
  smoke:
    if: github.repository == 'Mik-pe/vibeshop'
    runs-on: [self-hosted, Linux, X64, vibeshop]
    timeout-minutes: 2
    steps:
      - name: Identify selected runner
        shell: bash
        run: printf 'Runner %s is reachable.\n' "$RUNNER_NAME"
