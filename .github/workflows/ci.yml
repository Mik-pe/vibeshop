name: CI
on:
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'Mik-pe/vibeshop' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    runs-on: [self-hosted, Linux, X64, vibeshop]
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare isolated test evidence
        shell: bash
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/vibeshop-runtime-$GITHUB_RUN_ID"
          mkdir -p "$runtime" artifacts
          chmod 700 "$runtime"
          printf 'XDG_RUNTIME_DIR=%s\n' "$runtime" >> "$GITHUB_ENV"
          printf 'CARGO_TARGET_DIR=%s/../vibeshop-target\n' "$GITHUB_WORKSPACE" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          printf 'Runner: %s\nCommit: %s\n' "$RUNNER_NAME" "$GITHUB_SHA" | tee artifacts/run.txt
          git archive --format=zip --output=artifacts/source.zip HEAD
      - name: Check build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          for tool in cargo rustup pkg-config; do
            command -v "$tool" || { echo "Missing $tool. See docs/RUNNER.md."; exit 1; }
          done
          rustup show
          pkg-config --exists xkbcommon wayland-client
      - name: Compile and test actual GPU pixels
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo test --locked --all-targets -- --nocapture
      - name: Lints
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Formatting
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo fmt --all -- --check
      - name: Agent coordination
        if: ${{ !cancelled() }}
        shell: bash
        run: scripts/test-leases.sh
      - name: Native editing journey
        if: ${{ !cancelled() }}
        shell: bash
        run: scripts/smoke.sh
      - name: Capture formatting diagnostics after validation
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          cargo fmt --all
          git diff -- src tests > artifacts/formatting.patch
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: editor-evidence
          path: artifacts/
          retention-days: 7
      - name: Remove this run's temporary runtime directory
        if: always()
        shell: bash
        run: rmdir "$RUNNER_TEMP/vibeshop-runtime-$GITHUB_RUN_ID" || true
